name: Skills index

# Fails when a skill changed but .well-known/agent-skills/index.json wasn't rebuilt, so the digests rollstack.com
# serves always match the files agents download
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-index.mjs --check

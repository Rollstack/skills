name: Skills index

# Fails when a skill changed but .well-known/agent-skills/index.json wasn't rebuilt, so the digests rollstack.com
# serves always match the files agents download
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-index.mjs --check
      # Each client reads its own manifest, so one left at an old version would keep that client's users on it
      - run: node scripts/check-versions.mjs
      # Fails when mcp.json has a field Agent Plugins v1 doesn't allow, which makes strict clients skip the server
      - run: node scripts/build-chatgpt-zip.mjs
      # Fails when the plugin breaks a limit of Perplexity's importer, which would drop the server or refuse the plugin
      - run: node scripts/build-perplexity-zip.mjs

  # The checks Claude's plugin directory runs on its manifests, skills and .mcp.json
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict .

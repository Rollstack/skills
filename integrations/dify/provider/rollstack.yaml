identity:
  author: rollstack
  name: rollstack
  label:
    en_US: Rollstack
  description:
    en_US: Create polished presentations with advanced charts, right from your favourite agent. Plug in your own data whenever you need it.
  icon: icon.png
  tags:
    - productivity
    - business
credentials_for_provider:
  rollstack_api_key:
    type: secret-input
    required: true
    label:
      en_US: Rollstack API key
    placeholder:
      en_US: Starts with rsk_
    help:
      en_US: Create an API key in Rollstack, under Settings > Connected apps
    url: https://app.rollstack.com/settings/connected-apps

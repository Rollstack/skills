identity:
  name: removeBurstVariants
  author: rollstack
  label:
    en_US: Remove burst variants
description:
  human:
    en_US: Removes variants of a burst by their ids, and deletes their reports.
  llm: 'Removes variants of a burst by their ids, and deletes their reports. Find the ids with listBurstVariants, which shows each variant''s parameter or filter values, and confirm them with the user. An older report''s variant file stays in Google Drive or OneDrive. The user must be able to edit every variant passed, or nothing is removed: the burst''s owner and admins can edit them all, other members only their own. From an AI client, the removal only asks the user to confirm it in Rollstack: it answers `confirmation-required` and runs once they confirm.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Burst ID
  human_description:
    en_US: The burst to act on, by its id from listBursts.
  llm_description: 'The burst to act on, by its `id` from `listBursts`. You can also copy it from the burst''s link in Rollstack: it''s the part right after `/collections/`.'
- name: variantIds
  type: string
  required: true
  form: llm
  label:
    en_US: Variant IDs
  human_description:
    en_US: The variants to remove, by their id in listBurstVariants, which shows each one's parameter or filter values.
  llm_description: The variants to remove, by their `id` in `listBurstVariants`, which shows each one's parameter or filter values. Each must be a variant of this burst. 1 to 500 ids. Pass them as text, separated by commas, or as a JSON array.
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
output_schema:
  type: object
  properties:
    removed:
      type: array
      items:
        type: object
      description: The variants removed, whose reports are deleted.
    code:
      type: string
      description: '`confirmation-required` when Rollstack holds the call until you confirm it in Rollstack. Empty when it ran.'
    message:
      type: string
      description: What you are asked to confirm, with the link you confirm it at. Set with `code`.
extra:
  python:
    source: tools/remove_burst_variants.py

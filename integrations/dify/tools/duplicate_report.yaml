identity:
  name: duplicateReport
  author: rollstack
  label:
    en_US: Duplicate report
description:
  human:
    en_US: Copies a report of type SlideDeck with its slides, datasheets and email setup, as Duplicate in the app does, and answers the copy, which you own.
  llm: 'Copies a report of type SlideDeck with its slides, datasheets and email setup, as Duplicate in the app does, and answers the copy, which you own. Its schedules and direct shares are copied only when asked. Only members who may duplicate the report may: view access is enough. Each call makes another copy.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: name
  type: string
  required: true
  form: llm
  label:
    en_US: Name
  human_description:
    en_US: Name for the copy, as members will see it in Rollstack.
  llm_description: Name for the copy, as members will see it in Rollstack. Leading and trailing spaces are removed, and it can't be blank.
- name: folderId
  type: string
  required: false
  form: llm
  label:
    en_US: Folder ID
  human_description:
    en_US: The folder to put the copy in, by its id from listFolders; it must be one you can add reports to.
  llm_description: The folder to put the copy in, by its `id` from `listFolders`; it must be one you can add reports to. If omitted, the copy goes in the report's own folder, or for a burst's variant, in the burst's folder.
- name: copySchedules
  type: boolean
  required: false
  form: llm
  label:
    en_US: Copy schedules
  human_description:
    en_US: Also give the copy the report's schedules, so it updates on its own at the same times.
  llm_description: Also give the copy the report's schedules, so it updates on its own at the same times. Defaults to `false`.
- name: inheritSharing
  type: boolean
  required: false
  form: llm
  label:
    en_US: Inherit sharing
  human_description:
    en_US: Also share the copy with everyone the report is shared with directly, at the same permission.
  llm_description: Also share the copy with everyone the report is shared with directly, at the same permission. Defaults to `false`, so only you can open it until you share it.
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the report.
    type:
      type: string
      description: The kind of report, which decides the endpoints that work on it.
    name:
      type: string
      description: Name of the report, as members see it in Rollstack.
    folderId:
      type: string
      description: The folder the report is in, by its `id` in `listFolders`.
    owner:
      type: object
      description: 'The member who owns the report: whoever created it, unless ownership has since been transferred, in the app or with `transferReportOwnership`.'
    permission:
      type: string
      description: Your access to the report, as the user the API key belongs to.
    timezone:
      type: string
      description: The report's timezone, such as `America/New_York`.
    notifyOnFailure:
      type: boolean
      description: Whether Rollstack emails the report's owner when a scheduled run fails or some of its datasheets, or a file's visualizations, fail to refresh, copying everyone in `notificationMailingList`.
    lastSyncedAt:
      type: string
      description: When the report's latest run ended, whatever its outcome.
    lastSuccessfulUpdateAt:
      type: string
      description: 'When the report''s latest fully successful run ended: one that refreshed every datasheet it ran on, or every visualization on a report that updates a file, with none failing.'
    lastRunStatus:
      type: string
      description: How the report's latest run ended.
    running:
      type: boolean
      description: Whether a run of the report is in progress, whoever started it, such as you with `startReportRun`, a member in the app, or one of its schedules.
    appUrl:
      type: string
      description: Link that opens the report in Rollstack.
    fileUrl:
      type: string
      description: Link that opens the Google Slides, Google Docs, PowerPoint or Word file the report updates.
    createdAt:
      type: string
      description: When the report was created.
    updatedAt:
      type: string
      description: When the report's details last changed, such as its name, folder or owner, or the outcome of its latest run.
    notificationMailingList:
      type: array
      items:
        type: string
      description: Email addresses Rollstack copies when it emails the owner about a failed scheduled run, while `notifyOnFailure` is `true`.
    schedules:
      type: array
      items:
        type: object
      description: 'The report''s schedules: when Rollstack runs the report on its own to update it with fresh data.'
    sharedWith:
      type: array
      items:
        type: object
      description: Members the report is shared with directly, with their access.
extra:
  python:
    source: tools/duplicate_report.py

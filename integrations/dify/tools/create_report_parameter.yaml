identity:
  name: createReportParameter
  author: rollstack
  label:
    en_US: Create report parameter
description:
  human:
    en_US: Creates a parameter of a report, linked to the dashboard filters and datasheet columns given, as the app's report parameters editor does.
  llm: Creates a parameter of a report, linked to the dashboard filters and datasheet columns given, as the app's report parameters editor does. With a value, writes it into those filters, and as a row filter into those columns, and reads their datasheets again. Answers the parameter. Only the report's editors may.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: name
  type: string
  required: true
  form: llm
  label:
    en_US: Name
  human_description:
    en_US: The parameter's name, as shown in Rollstack.
  llm_description: The parameter's name, as shown in Rollstack. It can't be the name of another parameter of the report.
- name: filterIds
  type: string
  required: false
  form: llm
  label:
    en_US: Filter IDs
  human_description:
    en_US: 'The filters the parameter links, by their id in filters from getReportParameters: its value is written into each, in every datasheet that reads its dashboard.'
  llm_description: 'The filters the parameter links, by their `id` in `filters` from `getReportParameters`: its value is written into each, in every datasheet that reads its dashboard. Each must have no `parameterId` yet. A burst can vary by the parameter only if one of them has a `valueType`, or it links a column. Pass them as text, separated by commas, or as a JSON array.'
- name: columns
  type: string
  required: false
  form: llm
  label:
    en_US: Columns
  human_description:
    en_US: 'The columns the parameter links, by datasheetId and column as columns in getReportParameters lists them: its value is written into each as a row filter, in that datasheet only.'
  llm_description: |-
    The columns the parameter links, by `datasheetId` and `column` as `columns` in `getReportParameters` lists them: its value is written into each as a row filter, in that datasheet only. Each must have no `parameterId` yet. The value's `type` follows the first filter's `valueType`, or the first column's `kind` when it links no filter that can be set.
    Pass it as JSON text, as this JSON Schema describes:
    {"default":[],"maxItems":200,"type":"array","items":{"type":"object","properties":{"datasheetId":{"type":"string","format":"uuid","pattern":"^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$","description":"The datasheet's id, as `datasheetId` in `columns` from `getReportParameters`."},"column":{"type":"string","minLength":1,"maxLength":255,"description":"The column's name, as `column` in `columns` from `getReportParameters`."}},"required":["datasheetId","column"],"additionalProperties":false}}
- name: value
  type: string
  required: false
  form: llm
  label:
    en_US: Value
  human_description:
    en_US: The parameter's value, of the valueType of the filters it links.
  llm_description: |-
    The parameter's value, of the `valueType` of the filters it links. When set, it is written into those filters and their datasheets are read again with it, so the report's slides change. If `null` or omitted, as for a parameter a burst's variants will set, the filters keep their own values. A value of a report parameter, in the shape of its type. Copy the shape of the parameter's `value` in `listBursts`, or of a variant's in `listBurstVariants`:

    - A list of values: `{ "type": "categorical", "values": ["EMEA"] }`, with at least one value. `operator` can also be `is_not`, `contains` or `doesnt_contain`; it is `is` when left out.
    - A number: `{ "type": "number", "value": 10 }`. Text: `{ "type": "text", "value": "EMEA" }`.
    - A date range: `{ "type": "date", "subtype": "date_range", "startDate": "2026-01-01", "endDate": "2026-03-31" }`. One date: `{ "type": "date", "subtype": "date_single", "date": "2026-03-31" }`.
    - A month or a quarter: `{ "type": "date", "subtype": "date_month_year", "month": 3, "year": 2026 }` (months 1 to 12), `{ "type": "date", "subtype": "date_quarter_year", "quarter": 1, "year": 2026 }`.
    - A relative period: `{ "type": "date", "subtype": "date_relative", "rangeType": "lastN", "rangeN": 3, "periodType": "months" }`. `rangeType` is `current`, `lastN` or `nextN`; `periodType` is `days`, `weeks`, `months`, `quarters` or `years`, or `completeDays` through `completeYears` for whole periods only.
    Pass it as JSON text, as this JSON Schema describes:
    {"default":null,"anyOf":[{"anyOf":[{"type":"object","properties":{"type":{"type":"string","const":"categorical"},"values":{"type":"array","items":{"anyOf":[{"type":"string"},{"type":"number"}]}},"operator":{"type":"string","enum":["is","is_not","contains","doesnt_contain"]}},"required":["type","values"]},{"type":"object","properties":{"type":{"type":"string","const":"date"},"subtype":{"type":"string","const":"date_range"},"startDate":{"type":"string"},"endDate":{"type":"string"}},"required":["type","subtype","startDate","endDate"]},{"type":"object","properties":{"type":{"type":"string","const":"date"},"subtype":{"type":"string","const":"date_relative"},"rangeType":{"type":"string","enum":["current","lastN","nextN"]},"rangeN":{"type":"number"},"periodType":{"type":"string","enum":["days","weeks","months","quarters","years","completeDays","completeWeeks","completeMonths","completeQuarters","completeYears"]}},"required":["type","subtype","rangeType","rangeN","periodType"]},{"type":"object","properties":{"type":{"type":"string","const":"date"},"subtype":{"type":"string","const":"date_month_year"},"month":{"type":"number"},"year":{"type":"number"}},"required":["type","subtype","month","year"]},{"type":"object","properties":{"type":{"type":"string","const":"date"},"subtype":{"type":"string","const":"date_quarter_year"},"quarter":{"type":"number"},"year":{"type":"number"}},"required":["type","subtype","quarter","year"]},{"type":"object","properties":{"type":{"type":"string","const":"date"},"subtype":{"type":"string","const":"date_single"},"date":{"type":"string"}},"required":["type","subtype","date"]},{"type":"object","properties":{"type":{"type":"string","const":"date"},"subtype":{"type":"string","const":"date_null"}},"required":["type","subtype"]},{"type":"object","properties":{"type":{"type":"string","const":"number"},"value":{"type":"number"}},"required":["type","value"]},{"type":"object","properties":{"type":{"type":"string","const":"text"},"value":{"type":"string","minLength":1}},"required":["type","value"]}]},{"type":"null"}]}
output_schema:
  type: object
  properties:
    id:
      type: string
      description: The report parameter's id.
    name:
      type: string
      description: The report parameter's name, as shown in Rollstack.
    columns:
      type: array
      items:
        type: object
      description: 'The columns of datasheets the parameter links: its value is written into each as a row filter, in that datasheet only.'
    burstable:
      type: boolean
      description: 'Whether a burst can vary by the parameter: it links at least one filter whose `valueType` isn''t `null`, or at least one column that is still linked.'
    runId:
      type: string
      description: The run that reads again the datasheets the value was written into, as `runId` in `getReportRun`.
extra:
  python:
    source: tools/create_report_parameter.py

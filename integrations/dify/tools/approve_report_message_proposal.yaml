identity:
  name: approveReportMessageProposal
  author: rollstack
  label:
    en_US: Approve slides agent proposal
description:
  human:
    en_US: 'Approves the proposal of a settings_proposal or email_send_proposal reply, as its Approve button in the app''s chat does: Rollstack makes the change, or sends the email.'
  llm: 'Approves the proposal of a settings_proposal or email_send_proposal reply, as its Approve button in the app''s chat does: Rollstack makes the change, or sends the email. Only approve what the user approved after seeing the reply''s proposal. Answers the reply with the proposal''s status: applied once the change is made, and queued for a send, which getReportMessage then follows through sending to sent, partially_sent, failed or unconfirmed, with its counts. Needs also slide_decks:email for an email change or send, and slide_decks:write for the rest. Approving a send answers 409 while the report is updating, such as after a filter change the same message asked for, and counts against the 5 email sends a minute, as sendReportEmail does. Only the user who sent the message may, while they can edit the report. A proposal already decided answers 409. From an AI client, approving a send only asks the user to confirm it in Rollstack: it answers `confirmation-required` and runs once they confirm.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: messageId
  type: string
  required: true
  form: llm
  label:
    en_US: Message ID
  human_description:
    en_US: 'The message to the slides agent: the messageId that sendReportMessage returned.'
  llm_description: 'The message to the slides agent: the `messageId` that `sendReportMessage` returned. Only the user who sent the message can read, cancel or decide its proposals, and only while they can edit the report.'
- name: replyId
  type: string
  required: true
  form: llm
  label:
    en_US: Reply ID
  human_description:
    en_US: 'The reply that makes the proposal: the id of a settings_proposal or email_send_proposal reply that getReportMessage lists for the message.'
  llm_description: 'The reply that makes the proposal: the `id` of a `settings_proposal` or `email_send_proposal` reply that `getReportMessage` lists for the message.'
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Identifies the reply.
    status:
      type: string
      description: Where this reply stands.
    type:
      type: string
      description: What the reply is, which tells you what to do next.
    content:
      type: string
      description: 'The reply''s text, as the chat in the app shows it: what the agent did, its answer, or its questions.'
    questions:
      type: array
      items:
        type: object
      description: 'On a `clarification` reply: the multiple-choice questions the agent needs answered before it goes on.'
    changedSlideIds:
      type: array
      items:
        type: string
      description: 'On a `result` or `partial_result` reply: the slides the agent added or changed, in report order.'
    versionBeforeId:
      type: string
      description: 'On a `result` or `partial_result` reply: the report''s version saved just before the agent changed it.'
    proposal:
      type: object
      description: 'On a `settings_proposal` or `email_send_proposal` reply: what the proposal changes, or the email it sends, and where it stands.'
    code:
      type: string
      description: '`confirmation-required` when Rollstack holds the call until you confirm it in Rollstack. Empty when it ran.'
    message:
      type: string
      description: What you are asked to confirm, with the link you confirm it at. Set with `code`.
extra:
  python:
    source: tools/approve_report_message_proposal.py

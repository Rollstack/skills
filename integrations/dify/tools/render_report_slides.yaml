identity:
  name: renderReportSlides
  author: rollstack
  label:
    en_US: Render draft slides
description:
  human:
    en_US: Renders slides you wrote as HTML on a slide deck's template, so you can design slides yourself instead of asking the slides agent.
  llm: 'Renders slides you wrote as HTML on a slide deck''s template, so you can design slides yourself instead of asking the slides agent. It saves nothing. Each draft answers its image, the issues to fix and notes to check by eye: fix the issues and render again until none are left. Call getReportDesign first and follow the guide it answers. A chart or table a draft places is drawn with its datasheet''s data, or with the data of datasheetChanges you tried with previewReportDatasheetChanges and have not saved yet: save them with saveReportDatasheetChanges before you save the slides. A render that carries datasheetChanges runs one at a time with your queryReportData, previewReportDatasheetChanges and saveReportDatasheetChanges calls: send it only once those have answered. Only the report''s editors may. At most 10 drafts a call, and 20 renders and saves a minute per user.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: slides
  type: string
  required: true
  form: llm
  label:
    en_US: Slides
  human_description:
    en_US: The draft slides to render, 1 to 10 a call, each under an id of its own.
  llm_description: |-
    The draft slides to render, 1 to 10 a call, each under an id of its own.
    Pass it as JSON text, as this JSON Schema describes:
    {"minItems":1,"maxItems":10,"type":"array","items":{"$ref":"#/$defs/__schema2"},"$defs":{"__schema2":{"type":"object","properties":{"id":{"type":"string","pattern":"^[A-Za-z0-9_-]{1,64}$","description":"The id you give the slide: letters, digits, `_` and `-`, at most 64 characters. Pass an existing slide's id to redraw that slide."},"html":{"type":"string","minLength":1,"maxLength":200000,"description":"The slide as one `<section>` of HTML, as large as the report's canvas. No scripts, embedded pages, event attributes or anything loaded from outside it."}},"required":["id","html"],"additionalProperties":false}}}
- name: datasheetChanges
  type: string
  required: false
  form: llm
  label:
    en_US: Datasheet changes
  human_description:
    en_US: 'Changes to the report''s datasheets that aren''t saved yet, the ones you tried with previewReportDatasheetChanges: the drafts draw their charts and tables with the data they give, and a new datasheet is placed by the id the preview answered.'
  llm_description: |-
    Changes to the report's datasheets that aren't saved yet, the ones you tried with `previewReportDatasheetChanges`: the drafts draw their charts and tables with the data they give, and a new datasheet is placed by the id the preview answered. Save them with `saveReportDatasheetChanges` before you save the slides.

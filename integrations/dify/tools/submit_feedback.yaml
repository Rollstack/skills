identity:
  name: submitFeedback
  author: rollstack
  label:
    en_US: Send feedback
description:
  human:
    en_US: 'Tells the Rollstack team about something the user asked for that you couldn''t do: a tool or endpoint that is missing, a call that was refused or failed, or a task nothing covers.'
  llm: 'Tells the Rollstack team about something the user asked for that you couldn''t do: a tool or endpoint that is missing, a call that was refused or failed, or a task nothing covers. Send it only after the user agrees: tell them what you couldn''t do, offer to report it, and show what you''d send. The team reads every message to decide what to build next; it doesn''t answer, and it doesn''t fix the problem for the user.'
parameters:
- name: message
  type: string
  required: true
  form: llm
  label:
    en_US: Message
  human_description:
    en_US: What the user wanted, what you tried, and what was missing or blocked you, in a few sentences.
  llm_description: What the user wanted, what you tried, and what was missing or blocked you, in a few sentences. Name the tools you called and the errors they answered. Leave out credentials and personal data.
- name: operationId
  type: string
  required: false
  form: llm
  label:
    en_US: Operation ID
  human_description:
    en_US: The tool or operation that refused, failed or fell short, if one did.
  llm_description: The tool or operation that refused, failed or fell short, if one did.
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/submit_feedback.py

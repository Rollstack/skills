identity:
  name: getBurstRun
  author: rollstack
  label:
    en_US: Get burst run
description:
  human:
    en_US: Where the runs of a burst's variants stand, such as those startBurstRun started, with how each variant's latest run ended.
  llm: Where the runs of a burst's variants stand, such as those startBurstRun started, with how each variant's latest run ended. Waits up to waitSeconds for none of them to be running and answers as soon as that happens, so call it again while the status is running. A run started in the app or by a schedule counts too.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Burst ID
  human_description:
    en_US: The burst to act on, by its id from listBursts.
  llm_description: 'The burst to act on, by its `id` from `listBursts`. You can also copy it from the burst''s link in Rollstack: it''s the part right after `/collections/`.'
- name: waitSeconds
  type: number
  required: false
  form: llm
  label:
    en_US: Wait seconds
  human_description:
    en_US: 'How long this call waits for the work to finish, in seconds: the message to the slides agent on getReportMessage, the run on getReportRun, the batch of variants being added on getBurstVariantBatch, the runs of a burst''s variants on getBurstRun.'
  llm_description: 'How long this call waits for the work to finish, in seconds: the message to the slides agent on `getReportMessage`, the run on `getReportRun`, the batch of variants being added on `getBurstVariantBatch`, the runs of a burst''s variants on `getBurstRun`. It returns as soon as the work is done, or as things stand once the time is up, so call it again while `status` is still `queued` or `running`. `0` returns at once. Defaults to `20`; at most `30`.'
  min: 0
  max: 30
output_schema:
  type: object
  properties:
    status:
      type: string
      description: Where the burst's run stands.
    variants:
      type: array
      items:
        type: object
      description: The burst's variants you can see, oldest first.
extra:
  python:
    source: tools/get_burst_run.py

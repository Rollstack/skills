identity:
  name: listEmails
  author: rollstack
  label:
    en_US: List sent emails of all reports
description:
  human:
    en_US: 'The emails every report the user can see sent, of any type, newest first, each with its report, as the app''s Email sends page lists them: pass status failed and since to find the ones that didn''t go out, and burstId for one burst''s.'
  llm: 'The emails every report the user can see sent, of any type, newest first, each with its report, as the app''s Email sends page lists them: pass status failed and since to find the ones that didn''t go out, and burstId for one burst''s. Same fields as listReportEmails. Answers up to limit emails, 20 by default and 200 at most, and a nextCursor: pass it as cursor for the next page, until it is null.'
parameters:
- name: limit
  type: number
  required: false
  form: llm
  label:
    en_US: Limit
  human_description:
    en_US: Maximum number of emails to return on this page, from 1 to 200.
  llm_description: Maximum number of emails to return on this page, from 1 to 200. Defaults to `20`.
  min: 1
  max: 200
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor
  human_description:
    en_US: 'Where to continue the list: pass the nextCursor returned with the previous page to get the next one.'
  llm_description: 'Where to continue the list: pass the `nextCursor` returned with the previous page to get the next one. Omit it for the first page.'
- name: status
  type: select
  required: false
  form: llm
  label:
    en_US: Status
  human_description:
    en_US: 'Only the emails in this state, as the Email sends page filters them: failed the ones that could not be sent, opened the ones a recipient opened, and delivered the ones the email server accepted, opened or not.'
  llm_description: 'Only the emails in this state, as the Email sends page filters them: `failed` the ones that could not be sent, `opened` the ones a recipient opened, and `delivered` the ones the email server accepted, opened or not. If omitted, every email.'
  options:
  - value: delivered
    label:
      en_US: delivered
  - value: failed
    label:
      en_US: failed
  - value: opened
    label:
      en_US: opened
- name: since
  type: string
  required: false
  form: llm
  label:
    en_US: Since
  human_description:
    en_US: Only what happened at or after this time, as an ISO 8601 date and time in UTC, such as 2026-11-08T18:00:00Z.
  llm_description: Only what happened at or after this time, as an ISO 8601 date and time in UTC, such as `2026-11-08T18:00:00Z`. If omitted, from the start.
- name: burstId
  type: string
  required: false
  form: llm
  label:
    en_US: Burst ID
  human_description:
    en_US: 'Only the emails of this burst, by its id from listBursts: each variant''s own emails, and the emails its email configurations sent, which list its template as their report.'
  llm_description: 'Only the emails of this burst, by its `id` from `listBursts`: each variant''s own emails, and the emails its email configurations sent, which list its template as their report. If omitted, every report''s.'
output_schema:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
      description: The emails every report you can see sent, of any type, newest first, with what the Email sends page hides from you left empty.
    nextCursor:
      type: string
      description: Pass it as `cursor` to get the next page of emails.
extra:
  python:
    source: tools/list_emails.py

identity:
  name: deleteMemory
  author: rollstack
  label:
    en_US: Forget memory
description:
  human:
    en_US: 'Has the slides agent forget a memory: its runs stop reading it, as forgetting it in the app''s Slides settings does.'
  llm: 'Has the slides agent forget a memory: its runs stop reading it, as forgetting it in the app''s Slides settings does.'
parameters:
- name: memoryId
  type: string
  required: true
  form: llm
  label:
    en_US: Memory ID
  human_description:
    en_US: The memory to act on, by its id from listMemories.
  llm_description: The memory to act on, by its `id` from `listMemories`.
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/delete_memory.py

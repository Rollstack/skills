identity:
  name: getReportSlideHtml
  author: rollstack
  label:
    en_US: Get slide drafts
description:
  human:
    en_US: The HTML drafts slides of a slide deck were made from, to change them and save them again with saveReportSlides under the same ids.
  llm: 'The HTML drafts slides of a slide deck were made from, to change them and save them again with saveReportSlides under the same ids. A slide changed in Rollstack since its draft was saved, by a person in the editor or by Rollstack''s agent, answers the draft as it was saved with changedInRollstack, the list of what was changed since: make every one of those changes in the draft first, so the work done there is kept, then make your own. A slide made by hand in the editor has no draft (html is null): a draft sent under its id rewrites the whole slide, dropping what was done there, so look at it with getReportSlideImages and ask the user first. At most 10 slides a call.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: slideIds
  type: string
  required: true
  form: llm
  label:
    en_US: Slide IDs
  human_description:
    en_US: The slides whose drafts to read, by their id from getReportContent or a reply's changedSlideIds, hidden ones included.
  llm_description: 'The slides whose drafts to read, by their `id` from `getReportContent` or a reply''s `changedSlideIds`, hidden ones included. Ids that are not slides of the report are ignored. 1 to 10 ids: repeat the parameter for each one, as in `?slideIds=a&slideIds=b`. Pass them as text, separated by commas, or as a JSON array.'
output_schema:
  type: object
  properties:
    slides:
      type: array
      items:
        type: object
      description: The slides asked for, in report order.
extra:
  python:
    source: tools/get_report_slide_html.py

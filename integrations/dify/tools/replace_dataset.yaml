identity:
  name: replaceDataset
  author: rollstack
  label:
    en_US: Replace an uploaded file
description:
  human:
    en_US: Replaces an uploaded CSV file's rows, or a workbook's content with a new .xlsx sent as multipart/form-data in the file field.
  llm: Replaces an uploaded CSV file's rows, or a workbook's content with a new .xlsx sent as multipart/form-data in the file field. It keeps its id, and a CSV is never replaced by a workbook or the other way round. Reports built on it show the new content after their next run or message to the slides agent. An invalid file leaves the current one in place, and a sheet or range the new workbook no longer has fails its datasheets' reads. Only the user who created it may. From an MCP client, send a workbook with createDatasetUpload and this file's id.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Uploaded file ID
  human_description:
    en_US: 'The uploaded file to replace or delete: the id returned by createDataset.'
  llm_description: 'The uploaded file to replace or delete: the `id` returned by `createDataset`. Only the user who uploaded the file can replace or delete it; for anyone else, the request fails with a `404`, as if the file did not exist.'
- name: csv
  type: string
  required: true
  form: llm
  label:
    en_US: CSV
  human_description:
    en_US: 'The file''s data, as CSV text: a header row naming the columns, then at least one row of data.'
  llm_description: 'The file''s data, as CSV text: a header row naming the columns, then at least one row of data. With `replaceDataset`, it replaces the file''s whole content, header included, and the uploaded file must be a CSV file. The header''s names become the column names of the datasheets made from the file: a blank one becomes `Column N`, after the column''s position, and a repeated one gets a `_2`, `_3` suffix. Values can be separated by commas, semicolons or tabs, detected from the header row. At most 10 MB.'
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the uploaded file.
    name:
      type: string
      description: 'The uploaded file''s name: the `name` it was created with for a CSV file, or the workbook''s file name for an Excel workbook, such as `Q3 pipeline.xlsx`.'
    createdAt:
      type: string
      description: When the file was uploaded.
    updatedAt:
      type: string
      description: When the file's content was last replaced with `replaceDataset`, or when it was uploaded if it has never been replaced.
extra:
  python:
    source: tools/replace_dataset.py

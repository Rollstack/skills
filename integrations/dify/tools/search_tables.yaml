identity:
  name: searchTables
  author: rollstack
  label:
    en_US: Search tables
description:
  human:
    en_US: The tables and views of a Snowflake, Databricks or BigQuery connection whose full name, database.schema.table (project.dataset.table on BigQuery), holds any word of query, in any case, at most 50, read with the user's access to the connection, as its default user when one is set.
  llm: 'The tables and views of a Snowflake, Databricks or BigQuery connection whose full name, database.schema.table (project.dataset.table on BigQuery), holds any word of query, in any case, at most 50, read with the user''s access to the connection, as its default user when one is set. The first search of a connection reads its whole catalog, which can take a while on a large warehouse. On BigQuery it reads the billing project''s tables, and another project''s only when query names that project, by its ID or as the start of a name such as other-project.dataset. Search by the name the user gives and confirm the table with the user, then add it to a report with addReportDatasheets by its connection, database, schema and table, and pass the datasheet id on sendReportMessage: the slides agent queries it in the warehouse with SQL over all its rows. listConnections gives the connection''s type and id.'
parameters:
- name: type
  type: select
  required: true
  form: llm
  label:
    en_US: Type
  human_description:
    en_US: 'The type of connection, as type in listConnections: the Snowflake, Databricks or BigQuery data warehouse.'
  llm_description: 'The type of connection, as `type` in `listConnections`: the `Snowflake`, `Databricks` or `BigQuery` data warehouse.'
  options:
  - value: Snowflake
    label:
      en_US: Snowflake
  - value: Databricks
    label:
      en_US: Databricks
  - value: BigQuery
    label:
      en_US: BigQuery
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Connection ID
  human_description:
    en_US: Unique identifier for the connection, from listConnections, which also returns its type.
  llm_description: Unique identifier for the connection, from `listConnections`, which also returns its `type`.
- name: query
  type: string
  required: false
  form: llm
  label:
    en_US: Query
  human_description:
    en_US: 'Words to search for in names, separated by spaces: a dashboard, table, model or spreadsheet is returned when its name contains any of them, case-insensitively, a table''s full name with its database and schema.'
  llm_description: 'Words to search for in names, separated by spaces: a dashboard, table, model or spreadsheet is returned when its name contains any of them, case-insensitively, a table''s full name with its database and schema. If omitted, results aren''t filtered by name. At most 50 results are returned either way.'
output_schema:
  type: object
  properties:
    tables:
      type: array
      items:
        type: object
      description: The tables and views of a Snowflake, Databricks or BigQuery connection whose full name, database.schema.table (project.dataset.table on BigQuery), holds any word of query, in any case, at most 50, read with the user's access to the connection, as its default user when one is set.
extra:
  python:
    source: tools/search_tables.py

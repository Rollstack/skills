identity:
  name: showTemplates
  author: rollstack
  label:
    en_US: Show templates
description:
  human:
    en_US: Shows the user the templates they can build a slide deck in, each with a preview of its look, when the client can show a picker.
  llm: 'Shows the user the templates they can build a slide deck in, each with a preview of its look, when the client can show a picker. Pass reportId when they pick one for an existing report: each template then warns about the report''s slides it has no layout for. The template the user picks reaches you with their next message: then apply it with applyReportTemplate, or start a report in it with createReport''s templateId, as they ask. Answers the templates as listTemplates does, for clients that can''t show the picker.'
parameters:
- name: reportId
  type: string
  required: false
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: 'The report the user picks a template for, by its id from listReports: the picker warns about the slides each template has no layout for.'
  llm_description: 'The report the user picks a template for, by its `id` from `listReports`: the picker warns about the slides each template has no layout for. Its `type` must be `SlideDeck`, and you need edit access to it. Leave it out when the user picks one for a new report.'
extra:
  python:
    source: tools/show_templates.py

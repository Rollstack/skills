identity:
  name: getReportSlideImages
  author: rollstack
  label:
    en_US: Get slide images
description:
  human:
    en_US: 'Renders slides of a report as images, as viewers see them, so you can check how they look: text that overflows or overlaps, or a chart too small to read.'
  llm: 'Renders slides of a report as images, as viewers see them, so you can check how they look: text that overflows or overlaps, or a chart too small to read. After a message''s turn, pass its replies'' changedSlideIds. At most 10 slides a call; hidden slides are left out. Counts against the 10 exports a minute per user.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: slideIds
  type: string
  required: true
  form: llm
  label:
    en_US: Slide IDs
  human_description:
    en_US: The slides to render, from getReportContent or a reply's changedSlideIds.
  llm_description: 'The slides to render, from `getReportContent` or a reply''s `changedSlideIds`. Hidden slides and ids that are not slides of the report are ignored. 1 to 10 ids: repeat the parameter for each one, as in `?slideIds=a&slideIds=b`. Pass them as text, separated by commas, or as a JSON array.'
output_schema:
  type: object
  properties:
    slides:
      type: array
      items:
        type: object
      description: The rendered slides, in report order, whatever order `slideIds` lists them in.
extra:
  python:
    source: tools/get_report_slide_images.py

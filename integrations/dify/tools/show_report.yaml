identity:
  name: showReport
  author: rollstack
  label:
    en_US: Show report
description:
  human:
    en_US: 'Shows a report to the user in a viewer with every visible slide, when the client can show one, to browse it or review the slides the slides agent changed: pass the replies'' changedSlideIds to open on the first of them and mark them all.'
  llm: 'Shows a report to the user in a viewer with every visible slide, when the client can show one, to browse it or review the slides the slides agent changed: pass the replies'' changedSlideIds to open on the first of them and mark them all. Answers the slides'' ids and titles. Clients that can''t show the viewer can look at the slides with getReportSlideImages instead.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: changedSlideIds
  type: string
  required: false
  form: llm
  label:
    en_US: Changed slide IDs
  human_description:
    en_US: The slides the slides agent changed, from the replies' changedSlideIds, to open on the first of them and mark them all.
  llm_description: The slides the slides agent changed, from the replies' `changedSlideIds`, to open on the first of them and mark them all. Leave it out, or pass an empty list, to browse the report from its first slide. Pass them as text, separated by commas, or as a JSON array.
extra:
  python:
    source: tools/show_report.py

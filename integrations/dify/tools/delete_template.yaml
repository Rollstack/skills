identity:
  name: deleteTemplate
  author: rollstack
  label:
    en_US: Delete template
description:
  human:
    en_US: Deletes a company template, as the app's Templates drawer does.
  llm: Deletes a company template, as the app's Templates drawer does. Reports already built in it keep their look; new ones can no longer start in it. Its creator, or an admin for a shared one, may.
parameters:
- name: templateId
  type: string
  required: true
  form: llm
  label:
    en_US: Template ID
  human_description:
    en_US: The company template to act on, by its id from listTemplates.
  llm_description: The company template to act on, by its `id` from `listTemplates`. Rollstack's own template can't be changed.
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/delete_template.py

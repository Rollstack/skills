identity:
  name: createDocument
  author: rollstack
  label:
    en_US: Upload a document
description:
  human:
    en_US: 'Stores a document for the slides agent to read, such as a brief, a report or meeting notes, as when you attach one in the chat in the app: pass its id in documentIds on sendReportMessage.'
  llm: 'Stores a document for the slides agent to read, such as a brief, a report or meeting notes, as when you attach one in the chat in the app: pass its id in documentIds on sendReportMessage. Over MCP, send the document''s whole text as Markdown in text. Over REST, you can instead send the file as multipart/form-data in the file field: a .docx, .doc, .odt, .rtf, .pptx, .pdf, .txt or .md file of at most 100 MB and 100 pages, whose pages the agent can also look at. It joins your document library when you and your organization keep one.'
parameters:
- name: name
  type: string
  required: true
  form: llm
  label:
    en_US: Name
  human_description:
    en_US: 'The document''s name, without an extension: it is stored as a Markdown file named after it.'
  llm_description: 'The document''s name, without an extension: it is stored as a Markdown file named after it. The slides agent and the app''s chat show it. From 1 to 200 characters.'
- name: text
  type: string
  required: true
  form: llm
  label:
    en_US: Text
  human_description:
    en_US: 'The document''s whole text, in Markdown: headings, lists and tables keep their structure for the agent.'
  llm_description: 'The document''s whole text, in Markdown: headings, lists and tables keep their structure for the agent. Send what the document says, not a summary of it.'
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the document.
    name:
      type: string
      description: The document's file name, such as `Q3 strategy brief.pdf`.
    pageCount:
      type: number
      description: How many pages the document has, which the agent can look at.
extra:
  python:
    source: tools/create_document.py

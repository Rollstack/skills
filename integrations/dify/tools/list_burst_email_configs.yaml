  llm_description: 'The burst to act on, by its `id` from `listBursts`. You can also copy it from the burst''s link in Rollstack: it''s the part right after `/collections/`.'
output_schema:
  type: object
  properties:
    burstEmailConfigs:
      type: array
      items:
        type: object
      description: 'A burst''s email configurations, as the app''s Burst email settings show them: each one email to its own recipients that includes every variant it selects, sent only when you send it.'

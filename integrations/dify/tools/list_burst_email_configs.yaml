    en_US: 'A burst''s email configurations, as the app''s Burst email settings show them: each one email to its own recipients that includes every variant it selects, sent only when you send it.'
  llm: 'A burst''s email configurations, as the app''s Burst email settings show them: each one email to its own recipients that includes every variant it selects, sent only when you send it. Unlike each variant''s own email, which its runs send to its own recipients. What both sent is in listEmails with burstId.'

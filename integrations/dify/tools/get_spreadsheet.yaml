identity:
  name: getSpreadsheet
  author: rollstack
  label:
    en_US: Get spreadsheet
description:
  human:
    en_US: A Google Sheets or Excel file the user added in the app, with its sheets, read with the user's own Google or Microsoft account.
  llm: A Google Sheets or Excel file the user added in the app, with its sheets, read with the user's own Google or Microsoft account. Fails with user-missing-oauth when the user hasn't connected that account in the app. Find the file's id with searchSpreadsheets, then add a range of one of its sheets to a report with addReportDatasheets by the sheet's id.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Spreadsheet ID
  human_description:
    en_US: The spreadsheet whose sheets to list, by its id from searchSpreadsheets.
  llm_description: 'The spreadsheet whose sheets to list, by its `id` from `searchSpreadsheets`. This is Rollstack''s identifier, not the file''s id in Google Drive, OneDrive or SharePoint. It must be one of your own spreadsheets in Rollstack: another member''s spreadsheet returns `404`, as does an Excel file stored in Google Drive.'
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the spreadsheet in Rollstack, not the file's id in Google Drive, OneDrive or SharePoint.
    name:
      type: string
      description: 'The spreadsheet''s name, as it was when the file was added to Rollstack: renaming the file afterwards in Google Sheets or Excel doesn''t change it here.'
    type:
      type: string
      description: Which app the spreadsheet belongs to, and so which of your accounts Rollstack reads it with.
    url:
      type: string
      description: Link that opens the spreadsheet in Google Sheets or in Excel for the web, for example to check it's the right file before you add it to a report.
    sheets:
      type: array
      items:
        type: object
      description: The sheets (tabs) in the spreadsheet as they are now in Google Sheets or Excel, hidden ones included.
extra:
  python:
    source: tools/get_spreadsheet.py

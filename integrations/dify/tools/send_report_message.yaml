identity:
  name: sendReportMessage
  author: rollstack
  label:
    en_US: "Send message to slides agent"
description:
  human:
    en_US: "Asks the slides agent to build or change a report, or to answer a question about it, as the app's chat does."
  llm: "Asks the slides agent to build or change a report, or to answer a question about it, as the app's chat does. Answers the message's id at once: follow it with getReportMessage. Without chatId the message starts a new chat, which shows in the user's chat history in the app. With it, the message continues that chat and waits its turn while a reply is still generating. Several chats on a report can generate at once; an agent working on a part of the report another chat is editing works on something else or says so. Only its editors may. At most 6 messages a minute per user."
parameters:
  - name: id
    type: string
    required: true
    form: llm
    label:
      en_US: "Report ID"
    human_description:
      en_US: "The report to act on, by its id from listReports or createReport."
    llm_description: "The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report's link in Rollstack: it's the part right after `/slides/`."
  - name: content
    type: string
    required: false
    form: llm
    label:
      en_US: "Message"
    human_description:
      en_US: "Your message to the slides agent, as you would write it in the chat in the app: for example, slides to build or change, or a question about the report."
    llm_description: "Your message to the slides agent, as you would write it in the chat in the app: for example, slides to build or change, or a question about the report. On a report with no slides yet, the agent takes it as a request to build the report. A link to a picture in the message, such as a logo or a photo to place, is downloaded and given to the agent. Required unless you send `answers`; with them, it's sent after your answers as a note. At most 10,000 characters: send a longer text, such as a brief, as a document with `createDocument`."
  - name: chatId
    type: string
    required: false
    form: llm
    label:
      en_US: "Chat ID"
    human_description:
      en_US: "The chat to continue: the chatId returned for an earlier message."
    llm_description: "The chat to continue: the `chatId` returned for an earlier message. The agent reads the chat's earlier messages as context, and if it's still replying in that chat, your message waits its turn (`queued`). If omitted, the message starts a new chat, which shows in your chat history on the report in the app. Must be one of your own chats on this report."
  - name: slideIds
    type: string
    required: false
    form: llm
    label:
      en_US: "Slide IDs"
    human_description:
      en_US: "The slides your message is about, as when you select slides in the app before writing in the chat."
    llm_description: "The slides your message is about, as when you select slides in the app before writing in the chat. The agent knows you selected them and uses the datasheets on them for your request. Slide ids come from `getReportContent`. 1 to 100 slides of this report. Pass the ids as text, separated by commas."
  - name: answers
    type: string
    required: false
    form: llm
    label:
      en_US: "Answers"
    human_description:
      en_US: "Your answers to the questions of a clarification reply, as when you pick options in the chat in the app: one entry per question you answer."
    llm_description: |-
      Your answers to the questions of a `clarification` reply, as when you pick options in the chat in the app: one entry per question you answer. Send them as the next message on the same chat, by passing its `chatId`. When a picked option offers a dashboard, table or spreadsheet, Rollstack adds it to the report as a datasheet before the agent goes on. To add a note, send it in `content` with the answers. Pass it as JSON text: an array of objects with these fields.
      - `header` (required): The `header` of the question you're answering, copied unchanged from the `clarification` reply's `questions`.
      - `question` (required): The question you're answering, copied unchanged from the `clarification` reply's `questions`. With `header`, it tells Rollstack which question your picks are for.
      - `answers` (required): The `label` of each option picked: one for a question whose `multiSelect` is `false`, one or more when it's `true`.
output_schema:
  type: object
  properties:
    chatId:
      type: string
      description: "Identifies the chat the message is in, which also shows in your chat history on the report in the app."
    messageId:
      type: string
      description: "Identifies your message to the slides agent."
    status:
      type: string
      description: "Where the message stands."
    appUrl:
      type: string
      description: "Link to the report in Rollstack, with this chat open, where you can follow the conversation and review the changes the agent made."
extra:
  python:
    source: tools/send_report_message.py

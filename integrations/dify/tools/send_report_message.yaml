identity:
  name: sendReportMessage
  author: rollstack
  label:
    en_US: Send message to slides agent
description:
  human:
    en_US: Asks the slides agent to build or change a report, or to answer a question about it, as the app's chat does.
  llm: 'Asks the slides agent to build or change a report, or to answer a question about it, as the app''s chat does. Answers the message''s id at once: follow it with getReportMessage. When the client can show one, a view shows the user the slides as the agent drafts them. Without chatId the message starts a new chat, which shows in the user''s chat history in the app. With it, the message continues that chat and waits its turn while a reply is still generating. Several chats on a report can generate at once; an agent working on a part of the report another chat is editing works on something else or says so. For slides built from your own data, a connected dashboard, a warehouse table or a spreadsheet, upload the data with createDataset, find the dashboard or Salesforce report with searchDashboards, the Snowflake, Databricks or BigQuery table with searchTables or the spreadsheet with searchSpreadsheets, add any of them with addReportDatasheets and pass the datasheet ids as datasheetIds. For a brief, a report or notes to build from, upload it with createDocument and pass its id in documentIds. Only its editors may. At most 6 messages a minute per user. To write the slides yourself instead, start with getReportDesign.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: content
  type: string
  required: false
  form: llm
  label:
    en_US: Content
  human_description:
    en_US: 'Your message to the slides agent, as you would write it in the chat in the app: for example, slides to build or change, or a question about the report.'
  llm_description: 'Your message to the slides agent, as you would write it in the chat in the app: for example, slides to build or change, or a question about the report. On a report with no slides yet, the agent takes it as a request to build the report. A link to a picture in the message, such as a logo or a photo to place, is downloaded and given to the agent. Required unless you send `answers`; with them, it''s sent after your answers as a note. At most 10,000 characters: send a longer text, such as a brief, as a document with `createDocument`.'
- name: chatId
  type: string
  required: false
  form: llm
  label:
    en_US: Chat ID
  human_description:
    en_US: 'The chat to continue: the chatId returned for an earlier message.'
  llm_description: 'The chat to continue: the `chatId` returned for an earlier message. The agent reads the chat''s earlier messages as context, and if it''s still replying in that chat, your message waits its turn (`queued`). If omitted, the message starts a new chat, which shows in your chat history on the report in the app. Must be one of your own chats on this report.'
- name: slideIds
  type: string
  required: false
  form: llm
  label:
    en_US: Slide IDs
  human_description:
    en_US: The slides your message is about, as when you select slides in the app before writing in the chat.
  llm_description: The slides your message is about, as when you select slides in the app before writing in the chat. The agent knows you selected them and uses the datasheets on them for your request. Slide ids come from `getReportContent`. 1 to 100 slides of this report. Pass them as text, separated by commas, or as a JSON array.
- name: datasheetIds
  type: string
  required: false
  form: llm
  label:
    en_US: Datasheet IDs
  human_description:
    en_US: Datasheets of this report for the agent to work from, on top of those on the slides in slideIds, as when you pick data in the chat in the app.
  llm_description: Datasheets of this report for the agent to work from, on top of those on the slides in `slideIds`, as when you pick data in the chat in the app. To have the agent build slides from data you just added, pass the ids `addReportDatasheets` returned; for data already on the report, take them from `listReportDatasheets`. 1 to 100 datasheets of this report. Pass them as text, separated by commas, or as a JSON array.
- name: documentIds
  type: string
  required: false
  form: llm
  label:
    en_US: Document IDs
  human_description:
    en_US: 'Documents for the agent to read, as when you attach documents in the chat in the app: the ids createDocument returned.'
  llm_description: 'Documents for the agent to read, as when you attach documents in the chat in the app: the ids `createDocument` returned. The agent reads their text and looks at their pages, for example to build slides from a brief or to rebuild a report as slides. 1 to 5 documents your organization can read. Pass them as text, separated by commas, or as a JSON array.'
- name: answers
  type: string
  required: false
  form: llm
  label:
    en_US: Answers
  human_description:
    en_US: 'Your answers to the questions of a clarification reply, as when you pick options in the chat in the app: one entry per question you answer.'
  llm_description: |-
    Your answers to the questions of a `clarification` reply, as when you pick options in the chat in the app: one entry per question you answer. Send them as the next message on the same chat, by passing its `chatId`. When a picked option offers a dashboard, table or spreadsheet, Rollstack adds it to the report as a datasheet before the agent goes on. To add a note, send it in `content` with the answers.
    Pass it as JSON text, as this JSON Schema describes:
    {"minItems":1,"type":"array","items":{"type":"object","properties":{"header":{"type":"string","description":"The `header` of the question you're answering, copied unchanged from the `clarification` reply's `questions`.","examples":["Chart type"]},"question":{"type":"string","description":"The question you're answering, copied unchanged from the `clarification` reply's `questions`. With `header`, it tells Rollstack which question your picks are for.","examples":["Which chart should show revenue by region?"]},"answers":{"minItems":1,"type":"array","items":{"type":"string","examples":["Bar chart"]},"description":"The `label` of each option picked: one for a question whose `multiSelect` is `false`, one or more when it's `true`."}},"required":["header","question","answers"]}}
output_schema:
  type: object
  properties:
    chatId:
      type: string
      description: Identifies the chat the message is in, which also shows in your chat history on the report in the app.
    messageId:
      type: string
      description: Identifies your message to the slides agent.
    status:
      type: string
      description: Where the message stands.
    appUrl:
      type: string
      description: Link to the report in Rollstack, with this chat open, where you can follow the conversation and review the changes the agent made.
extra:
  python:
    source: tools/send_report_message.py

identity:
  name: getReportMessage
  author: rollstack
  label:
    en_US: Get slides agent message
description:
  human:
    en_US: A message to the slides agent and its replies.
  llm: 'A message to the slides agent and its replies. Waits up to waitSeconds for the message to finish and answers as soon as it does, so call it again while the status is queued or running. A clarification reply asks questions: ask the user, then send the options they pick as answers in a new message on the same chat. A proposal reply changes nothing until it is approved: show the user what its proposal changes, then approve or reject it as they decide. Only the user who sent the message may read it, while they can edit the report.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: messageId
  type: string
  required: true
  form: llm
  label:
    en_US: Message ID
  human_description:
    en_US: 'The message to the slides agent: the messageId that sendReportMessage returned.'
  llm_description: 'The message to the slides agent: the `messageId` that `sendReportMessage` returned. Only the user who sent the message can read, cancel or decide its proposals, and only while they can edit the report.'
- name: waitSeconds
  type: number
  required: false
  form: llm
  label:
    en_US: Wait seconds
  human_description:
    en_US: 'How long this call waits for the work to finish, in seconds: the message to the slides agent on getReportMessage, the run on getReportRun, the batch of variants being added on getBurstVariantBatch, the runs of a burst''s variants on getBurstRun.'
  llm_description: 'How long this call waits for the work to finish, in seconds: the message to the slides agent on `getReportMessage`, the run on `getReportRun`, the batch of variants being added on `getBurstVariantBatch`, the runs of a burst''s variants on `getBurstRun`. It returns as soon as the work is done, or as things stand once the time is up, so call it again while `status` is still `queued` or `running`. `0` returns at once. Defaults to `20`; at most `30`.'
  min: 0
  max: 30
output_schema:
  type: object
  properties:
    chatId:
      type: string
      description: Identifies the chat the message is in, which also shows in your chat history on the report in the app.
    messageId:
      type: string
      description: Identifies your message to the slides agent.
    status:
      type: string
      description: Where the message stands.
    appUrl:
      type: string
      description: Link to the report in Rollstack, with this chat open, where you can follow the conversation and review the changes the agent made.
    stage:
      type: string
      description: What the slides agent is doing right now, in the words the chat in the app shows, such as `Understanding your request`, `Refreshing data`, `Design` or `Finishing up`.
    createdAt:
      type: string
      description: When you sent the message to the slides agent.
    updatedAt:
      type: string
      description: When the message or any of its replies last changed, for example as the agent reports progress or finishes a reply.
    replies:
      type: array
      items:
        type: object
      description: The slides agent's replies to this message, in order.
extra:
  python:
    source: tools/get_report_message.py

identity:
  name: listBurstVariants
  author: rollstack
  label:
    en_US: List burst variants
description:
  human:
    en_US: A burst's variants the user can open, oldest first, each with its values of the burst's parameters or filters, how its latest run went, whether one is going, and who its email goes to. adding lists the variants the user is still adding.
  llm: 'A burst''s variants the user can open, oldest first, each with its values of the burst''s parameters or filters, how its latest run went, whether one is going, and who its email goes to. adding lists the variants the user is still adding. Answers up to limit variants, 50 by default and 200 at most, and a nextCursor: pass it as cursor for the next page, until it is null.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Burst ID
  human_description:
    en_US: The burst to act on, by its id from listBursts.
  llm_description: 'The burst to act on, by its `id` from `listBursts`. You can also copy it from the burst''s link in Rollstack: it''s the part right after `/collections/`.'
- name: limit
  type: number
  required: false
  form: llm
  label:
    en_US: Limit
  human_description:
    en_US: Maximum number of variants to return on this page, from 1 to 200.
  llm_description: Maximum number of variants to return on this page, from 1 to 200. Defaults to `50`.
  min: 1
  max: 200
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor
  human_description:
    en_US: 'Where to continue the list: pass the nextCursor returned with the previous page to get the next one.'
  llm_description: 'Where to continue the list: pass the `nextCursor` returned with the previous page to get the next one. Omit it for the first page.'
output_schema:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
      description: The variants on this page that you can open, oldest first.
    nextCursor:
      type: string
      description: Pass it as `cursor` to get the next page of variants.
    adding:
      type: array
      items:
        type: object
      description: The variants you are adding with `addBurstVariants` or in the app, while that is still going.
extra:
  python:
    source: tools/list_burst_variants.py

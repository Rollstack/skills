identity:
  name: startReportRun
  author: rollstack
  label:
    en_US: Start report run
description:
  human:
    en_US: Refreshes a report's data, or only some of its datasheets, then repairs failed calculations and the slides with AI.
  llm: 'Refreshes a report''s data, or only some of its datasheets, then repairs failed calculations and the slides with AI. On a report of another type than SlideDeck, such as a Google Slides presentation, refreshes every sync, or only the `syncIds` given, instead, as Update in the app does, updating its file when it has one (an Email report has none). A run of the whole report then emails it when its email trigger is `all`; a run of only some `syncIds` never does. Answers the run''s id at once; while a run of the report is already going, from the API, the app or its schedule, it answers that run''s id with started false and starts nothing. Pass repairSlides false to leave the slides as they are, when you wrote them yourself and will check and fix them. From an AI client, a run that emails the report only asks the user to confirm it in Rollstack: it answers `confirmation-required` and runs once they confirm.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, of any type, by its id from listReports or createReport.
  llm_description: 'The report to act on, of any `type`, by its `id` from `listReports` or `createReport`. You can also copy it from the report''s link in Rollstack (`appUrl`): it''s the part right after `/slides/` or `/destinations/`.'
- name: datasheetIds
  type: string
  required: false
  form: llm
  label:
    en_US: Datasheet IDs
  human_description:
    en_US: The datasheets to update, from listReportDatasheets, instead of the whole report.
  llm_description: 'The datasheets to update, from `listReportDatasheets`, instead of the whole report. Each must be a datasheet of this report. Unlike a run of the whole report, which reads every source again, a run of only some datasheets reuses the data last read from their sources: it reads a source again only if that data is missing or expired, or what the datasheet reads has changed, such as its source, its filters or the connection it reads with, as when you replace an uploaded file with `replaceDataset`. If omitted, the run updates the whole report. 1 to 500 ids. Only on reports whose `type` is `SlideDeck`: a report of another type has syncs instead, so passing it returns `400`. Pass them as text, separated by commas, or as a JSON array.'
- name: syncIds
  type: string
  required: false
  form: llm
  label:
    en_US: Sync IDs
  human_description:
    en_US: The syncs to update, from listReportSyncs, instead of the whole report, such as the ones whose status is failed.
  llm_description: The syncs to update, from `listReportSyncs`, instead of the whole report, such as the ones whose `status` is `failed`. Each must be a sync of this report. A `paused` sync is skipped, as in the app. A run of only some syncs never emails the report. If omitted, the run updates the whole report. 1 to 500 ids. Only on reports other than `SlideDeck`, which has datasheets instead, so passing it on a slide deck returns `400`. Pass them as text, separated by commas, or as a JSON array.
- name: repairSlides
  type: boolean
  required: false
  form: llm
  label:
    en_US: Repair slides
  human_description:
    en_US: 'Whether Rollstack repairs the slides with AI once the data is in: failed calculations, and text the new data made wrong.'
  llm_description: 'Whether Rollstack repairs the slides with AI once the data is in: failed calculations, and text the new data made wrong. Pass `false` to read the data only, when you check and fix the slides yourself. If omitted, the slides are repaired. Only on reports whose `type` is `SlideDeck`.'
output_schema:
  type: object
  properties:
    runId:
      type: string
      description: Identifies the run.
    started:
      type: boolean
      description: Whether this request started a new run.
    code:
      type: string
      description: '`confirmation-required` when Rollstack holds the call until you confirm it in Rollstack. Empty when it ran.'
    message:
      type: string
      description: What you are asked to confirm, with the link you confirm it at. Set with `code`.
extra:
  python:
    source: tools/start_report_run.py

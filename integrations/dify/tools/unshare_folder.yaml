identity:
  name: unshareFolder
  author: rollstack
  label:
    en_US: Unshare folder
description:
  human:
    en_US: Removes a member's direct share of a folder, and their access to its reports' files in Drive unless they still reach the folder through a parent folder, as the app does.
  llm: 'Removes a member''s direct share of a folder, and their access to its reports'' files in Drive unless they still reach the folder through a parent folder, as the app does. Access through a parent folder stays: unshare that folder instead. Needs manage on the folder, or owning it, except to unshare it from yourself.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Folder ID
  human_description:
    en_US: The folder to act on, by its id from listFolders or createFolder.
  llm_description: The folder to act on, by its `id` from `listFolders` or `createFolder`.
- name: userId
  type: number
  required: true
  form: llm
  label:
    en_US: User ID
  human_description:
    en_US: 'The member to share the folder with, or to unshare it from: their id from listMembers, which only owners and admins can call, or their userId in access from getFolder.'
  llm_description: 'The member to share the folder with, or to unshare it from: their `id` from `listMembers`, which only owners and admins can call, or their `userId` in `access` from `getFolder`. Only active members of the organization. Anyone the folder is shared with can unshare it from themselves.'
  max: 9007199254740991
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/unshare_folder.py

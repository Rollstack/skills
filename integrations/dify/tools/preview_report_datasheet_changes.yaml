identity:
  name: previewReportDatasheetChanges
  author: rollstack
  label:
    en_US: Preview datasheet changes
description:
  human:
    en_US: 'Tries changes to a report''s datasheets, to shape data before it goes on a slide: a new datasheet, a query, steps after a join, a read type, an unpivot.'
  llm: 'Tries changes to a report''s datasheets, to shape data before it goes on a slide: a new datasheet, a query, steps after a join, a read type, an unpivot. It runs every datasheet the changes touch over the data stored at the sources'' last reads and saves nothing, not even a new datasheet. Answers each datasheet''s columns and five sample rows, the ids a new datasheet gets, and the revisions to send to saveReportDatasheetChanges. A change that fails answers valid false with its reason, naming the datasheet and step: fix it and preview again. Draw a slide with the same changes by sending them to renderReportSlides. Only the report''s editors may. Your previews run one at a time, together with your queryReportData and saveReportDatasheetChanges calls and the renderReportSlides calls that carry datasheetChanges: send the next only once this one answers, never several at once, and try several datasheets'' changes in one preview. At most 30 previews and queryReportData calls a minute per user, counted together.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: changes
  type: string
  required: true
  form: llm
  label:
    en_US: Changes
  human_description:
    en_US: 'The changes to the report''s datasheets, applied in order: create for a datasheet the report doesn''t have yet (a query, one SQL statement, or a join and steps over elements that datasheets of the report read already, under a temporaryId you choose), set-query or set-ops for the data of one it has (getReportDatasheet gives what it is now), set-read-type and set-unpivot.'
  llm_description: |-
    The changes to the report's datasheets, applied in order: `create` for a datasheet the report doesn't have yet (a query, one SQL statement, or a join and steps over elements that datasheets of the report read already, under a `temporaryId` you choose), `set-query` or `set-ops` for the data of one it has (`getReportDatasheet` gives what it is now), `set-read-type` and `set-unpivot`. Each datasheet is its reads followed by the ops over them: call `getReportDataGuide` for the query model, SQL and joins. A `temporaryId` can be used once: after a save, create the next datasheet under another.

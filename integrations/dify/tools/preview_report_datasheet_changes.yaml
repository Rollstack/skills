output_schema:
  type: object
  properties:
    valid:
      type: boolean
      description: Valid
    resolvedDatasheetIds:
      type: object
      description: The id of each datasheet a `create` makes, by its `temporaryId`.
    resolvedOperationIds:
      type: object
      description: The id of each op a change adds, by its `ref`.
    removedOperations:
      type: array
      items:
        type: object
      description: The existing ops a change drops, so you can check what it replaced.
    outputs:
      type: object
      description: Each changed datasheet by id, with its columns and five sample rows.
    revisions:
      type: object
      description: The revision of each existing datasheet the changes edit, to send back to `saveReportDatasheetChanges`.
    error:
      type: string
      description: Why the changes failed, naming the datasheet, op and field when it can.
extra:
  python:
    source: tools/preview_report_datasheet_changes.py

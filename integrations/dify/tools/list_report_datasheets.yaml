identity:
  name: listReportDatasheets
  author: rollstack
  label:
    en_US: List report datasheets
description:
  human:
    en_US: The datasheets a report's charts and tables are built from, with their source and when each was last read.
  llm: 'The datasheets a report''s charts and tables are built from, with their source and when each was last read. An entry whose `copyOf` is set repeats that datasheet for one more element of a slide: it shows the same data and is read together with it, so count each piece of data once by skipping the entries with a `copyOf`. Only a datasheet a slide shows has a `lastBuiltAt`.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
output_schema:
  type: object
  properties:
    datasheets:
      type: array
      items:
        type: object
      description: The datasheets a report's charts and tables are built from, with their source and when each was last read.
extra:
  python:
    source: tools/list_report_datasheets.py

identity:
  name: searchModels
  author: rollstack
  label:
    en_US: Search models
description:
  human:
    en_US: 'The models of a Looker, Power BI or Tableau connection whose name or group holds any word of query or its singular, in any case, at most 50: Looker explores grouped by LookML model, Power BI semantic models by workspace, Tableau published data sources by project, read with the user''s access to the connection (on Tableau, their own Tableau user).'
  llm: 'The models of a Looker, Power BI or Tableau connection whose name or group holds any word of query or its singular, in any case, at most 50: Looker explores grouped by LookML model, Power BI semantic models by workspace, Tableau published data sources by project, read with the user''s access to the connection (on Tableau, their own Tableau user). A model is what the slides agent queries in its BI tool for the data a slide needs, where a dashboard tab comes in as a picture. Confirm the model with the user, then add it to a report with addReportDatasheets by its modelId and pass the new datasheet''s id to sendReportMessage. listConnections gives the connection''s type and id.'
parameters:
- name: type
  type: select
  required: true
  form: llm
  label:
    en_US: Type
  human_description:
    en_US: The type of connection, as type in listConnections.
  llm_description: 'The type of connection, as `type` in `listConnections`. Only Looker, Power BI (`PowerBI`) and Tableau connections have models: Looker explores, Power BI semantic models and Tableau published data sources.'
  options:
  - value: Looker
    label:
      en_US: Looker
  - value: PowerBI
    label:
      en_US: PowerBI
  - value: Tableau
    label:
      en_US: Tableau
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Connection ID
  human_description:
    en_US: Unique identifier for the connection, from listConnections, which also returns its type.
  llm_description: Unique identifier for the connection, from `listConnections`, which also returns its `type`.
- name: query
  type: string
  required: false
  form: llm
  label:
    en_US: Query
  human_description:
    en_US: 'Words to search for in names, separated by spaces: a dashboard, table, model or spreadsheet is returned when its name contains any of them, case-insensitively, a table''s full name with its database and schema.'
  llm_description: 'Words to search for in names, separated by spaces: a dashboard, table, model or spreadsheet is returned when its name contains any of them, case-insensitively, a table''s full name with its database and schema. If omitted, results aren''t filtered by name. At most 50 results are returned either way.'
output_schema:
  type: object
  properties:
    models:
      type: array
      items:
        type: object
      description: 'The models of a Looker, Power BI or Tableau connection whose name or group holds any word of query or its singular, in any case, at most 50: Looker explores grouped by LookML model, Power BI semantic models by workspace, Tableau published data sources by project, read with the user''s access to the connection (on Tableau, their own Tableau user).'
extra:
  python:
    source: tools/search_models.py

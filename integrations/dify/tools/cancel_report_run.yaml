identity:
  name: cancelReportRun
  author: rollstack
  label:
    en_US: Cancel report run
description:
  human:
    en_US: Cancels a run of a report, whoever started it.
  llm: Cancels a run of a report, whoever started it. Only its editors may. A run that already ended stays as it is.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, of any type, by its id from listReports or createReport.
  llm_description: 'The report to act on, of any `type`, by its `id` from `listReports` or `createReport`. You can also copy it from the report''s link in Rollstack (`appUrl`): it''s the part right after `/slides/` or `/destinations/`.'
- name: runId
  type: string
  required: true
  form: llm
  label:
    en_US: Run ID
  human_description:
    en_US: The run, by the runId that startReportRun returned.
  llm_description: The run, by the `runId` that `startReportRun` returned. Runs of a report started by the same member share one id, so it always refers to that member's latest run of the report.
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/cancel_report_run.py

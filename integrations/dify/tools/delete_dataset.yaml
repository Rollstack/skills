identity:
  name: deleteDataset
  author: rollstack
  label:
    en_US: Delete an uploaded file
description:
  human:
    en_US: Deletes an uploaded CSV file or workbook.
  llm: Deletes an uploaded CSV file or workbook. Reports built on it keep what they last showed, and their datasheets fail on the next read. Only the user who created it may.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Uploaded file ID
  human_description:
    en_US: 'The uploaded file to replace or delete: the id returned by createDataset.'
  llm_description: 'The uploaded file to replace or delete: the `id` returned by `createDataset`. Only the user who uploaded the file can replace or delete it; for anyone else, the request fails with a `404`, as if the file did not exist.'
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/delete_dataset.py

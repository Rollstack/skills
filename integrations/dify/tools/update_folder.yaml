identity:
  name: updateFolder
  author: rollstack
  label:
    en_US: Update folder
description:
  human:
    en_US: Renames a folder, or moves it into another folder or to the top level, with everything in it.
  llm: 'Renames a folder, or moves it into another folder or to the top level, with everything in it. Members of the folder it moves into get access to its reports. Needs manage on the folder, or owning it, and the same on the one it moves into. Answers the name and parent of the folder: getFolder gives who has access.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Folder ID
  human_description:
    en_US: The folder to act on, by its id from listFolders or createFolder.
  llm_description: The folder to act on, by its `id` from `listFolders` or `createFolder`.
- name: name
  type: string
  required: false
  form: llm
  label:
    en_US: Name
  human_description:
    en_US: The folder's name, as members will see it in Rollstack.
  llm_description: The folder's name, as members will see it in Rollstack. Leading and trailing spaces are removed, and it can't be blank.
- name: parentFolderId
  type: string
  required: false
  form: llm
  label:
    en_US: Parent folder ID
  human_description:
    en_US: The folder to move it into, by its id from listFolders, one you own or have manage on, and not the folder itself or one nested in it.
  llm_description: The folder to move it into, by its `id` from `listFolders`, one you own or have `manage` on, and not the folder itself or one nested in it. Pass `null` to move it to the top level. Its reports, bursts and subfolders move with it.
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the folder.
    name:
      type: string
      description: The folder's name, as shown in Rollstack.
    parentFolderId:
      type: string
      description: The folder this one is nested in.
extra:
  python:
    source: tools/update_folder.py

identity:
  name: listReportSyncFilters
  author: rollstack
  label:
    en_US: List sync filters
description:
  human:
    en_US: 'The filters of the dashboard an older report''s sync reads, which a burst of the report can vary by: pass their ids in filters to createBurst.'
  llm: 'The filters of the dashboard an older report''s sync reads, which a burst of the report can vary by: pass their ids in filters to createBurst. Read from the dashboard with your access to its connection, so it can take a few seconds. Find the report''s syncs with listReportSyncs. A Rollstack report bursts by report parameters instead: see getReportParameters.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, of any type, by its id from listReports or createReport.
  llm_description: 'The report to act on, of any `type`, by its `id` from `listReports` or `createReport`. You can also copy it from the report''s link in Rollstack (`appUrl`): it''s the part right after `/slides/` or `/destinations/`.'
- name: syncId
  type: string
  required: true
  form: llm
  label:
    en_US: Sync ID
  human_description:
    en_US: The sync whose dashboard filters to list, by its id from listReportSyncs.
  llm_description: The sync whose dashboard filters to list, by its `id` from `listReportSyncs`.
output_schema:
  type: object
  properties:
    filters:
      type: array
      items:
        type: object
      description: The filters of the sync's dashboard a burst can vary by, by name.
    unsupported:
      type: array
      items:
        type: object
      description: The dashboard's filters Rollstack can't set, so a burst can't vary by them.
extra:
  python:
    source: tools/list_report_sync_filters.py

identity:
  name: restoreReportVersion
  author: rollstack
  label:
    en_US: Restore report version
description:
  human:
    en_US: 'Takes a report of type SlideDeck back to one of its versions, as Restore in the app''s Version history does: its slides, and the datasheets when the version saved them, become the version''s, replacing every change made since, and members with the report open see it at once.'
  llm: 'Takes a report of type SlideDeck back to one of its versions, as Restore in the app''s Version history does: its slides, and the datasheets when the version saved them, become the version''s, replacing every change made since, and members with the report open see it at once. Find the version with listReportVersions, or take a slides agent reply''s versionBeforeId to undo that reply. The report as it was is saved first, and the answer names that version as versionBeforeId. Only its editors may, and not while the report is running or the slides agent is working on it.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: versionId
  type: string
  required: true
  form: llm
  label:
    en_US: Version ID
  human_description:
    en_US: 'The version to restore: an id from listReportVersions, or a reply''s versionBeforeId.'
  llm_description: 'The version to restore: an `id` from `listReportVersions`, or a reply''s `versionBeforeId`.'
output_schema:
  type: object
  properties:
    versionBeforeId:
      type: string
      description: The version of the report saved just before the restore, with the slides and datasheets it replaced.
    skippedDatasheetIds:
      type: array
      items:
        type: string
      description: Datasheets the version had that stayed as they are now, because they read a source deleted since.
extra:
  python:
    source: tools/restore_report_version.py

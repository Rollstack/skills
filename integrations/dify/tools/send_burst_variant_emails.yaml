identity:
  name: sendBurstVariantEmails
  author: rollstack
  label:
    en_US: Send variant emails
description:
  human:
    en_US: 'Sends each variant''s own email now, to its own recipients, as the app''s Send does: every variant, or those passed.'
  llm: 'Sends each variant''s own email now, to its own recipients, as the app''s Send does: every variant, or those passed. The template sends nothing. Every recipient gets an email. Only the burst''s owner and admins may. Sends have a low rate limit. From an AI client, the send only asks the user to confirm it in Rollstack: it answers `confirmation-required` and runs once they confirm.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Burst ID
  human_description:
    en_US: The burst to act on, by its id from listBursts.
  llm_description: 'The burst to act on, by its `id` from `listBursts`. You can also copy it from the burst''s link in Rollstack: it''s the part right after `/collections/`.'
- name: variantIds
  type: string
  required: false
  form: llm
  label:
    en_US: Variant IDs
  human_description:
    en_US: The variants to act on, by their id in listBurstVariants, instead of every variant.
  llm_description: The variants to act on, by their `id` in `listBurstVariants`, instead of every variant. Each must be a variant of this burst. 1 to 500 ids. Pass them as text, separated by commas, or as a JSON array.
output_schema:
  type: object
  properties:
    sending:
      type: array
      items:
        type: object
      description: The variants whose email is going out now, each to its own recipients.
    skipped:
      type: array
      items:
        type: object
      description: The variants left out since their email has no one in `to`.
    code:
      type: string
      description: '`confirmation-required` when Rollstack holds the call until you confirm it in Rollstack. Empty when it ran.'
    message:
      type: string
      description: What you are asked to confirm, with the link you confirm it at. Set with `code`.
extra:
  python:
    source: tools/send_burst_variant_emails.py

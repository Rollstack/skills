identity:
  name: getFolder
  author: rollstack
  label:
    en_US: Get folder
description:
  human:
    en_US: 'A folder the user can see, with its parent and everyone who has access to it: its owner, the members it is shared with directly, and those who reach it through the folder it is nested in, each with their permission.'
  llm: 'A folder the user can see, with its parent and everyone who has access to it: its owner, the members it is shared with directly, and those who reach it through the folder it is nested in, each with their permission.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Folder ID
  human_description:
    en_US: The folder to act on, by its id from listFolders or createFolder.
  llm_description: The folder to act on, by its `id` from `listFolders` or `createFolder`.
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the folder.
    name:
      type: string
      description: The folder's name, as shown in Rollstack.
    parentFolderId:
      type: string
      description: The folder this one is nested in.
    permission:
      type: string
      description: 'What you can do in the folder: `view`, `edit` or `manage`, as in `listFolders`.'
    access:
      type: array
      items:
        type: object
      description: Everyone with access to the folder, the owner first.
extra:
  python:
    source: tools/get_folder.py

identity:
  name: deleteReportParameter
  author: rollstack
  label:
    en_US: Delete report parameter
description:
  human:
    en_US: Deletes a parameter of a report, as the app's report parameters editor does.
  llm: 'Deletes a parameter of a report, as the app''s report parameters editor does. The filters and columns it linked keep the last value it wrote, and a burst that varies by it stops varying by it. Refused for the last parameter a burst varies by, and on a burst''s variant, whose parameters follow its template report''s: delete it there. Only the report''s editors may.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
- name: parameterId
  type: string
  required: true
  form: llm
  label:
    en_US: Parameter ID
  human_description:
    en_US: The parameter to act on, by its id in parameters from getReportParameters.
  llm_description: The parameter to act on, by its `id` in `parameters` from `getReportParameters`.
extra:
  python:
    source: tools/delete_report_parameter.py

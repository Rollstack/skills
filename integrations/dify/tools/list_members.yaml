identity:
  name: listMembers
  author: rollstack
  label:
    en_US: List members
description:
  human:
    en_US: The members of the organization, with their role, authentication role, insights access and whether they are active.
  llm: The members of the organization, with their role, authentication role, insights access and whether they are active. Optionally only those with a status, active or deactivated, or with an email.
parameters:
- name: status
  type: select
  required: false
  form: llm
  label:
    en_US: Status
  human_description:
    en_US: Only return active members, or only deactivated ones.
  llm_description: Only return `active` members, or only `deactivated` ones. If omitted, returns both.
  options:
  - value: active
    label:
      en_US: active
  - value: deactivated
    label:
      en_US: deactivated
- name: email
  type: string
  required: false
  form: llm
  label:
    en_US: Email
  human_description:
    en_US: Only return the member with exactly this email address, ignoring case.
  llm_description: Only return the member with exactly this email address, ignoring case. Returns an empty list if no member has it, or if they don't match `status`.
output_schema:
  type: object
  properties:
    members:
      type: array
      items:
        type: object
      description: The members of the organization, with their role, authentication role, insights access and whether they are active.
extra:
  python:
    source: tools/list_members.py

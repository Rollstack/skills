identity:
  name: createTemplate
  author: rollstack
  label:
    en_US: Import template
description:
  human:
    en_US: 'Imports a company template from a Google Slides presentation, as the app''s Templates drawer does: its theme, slide masters, layouts and slide size, not its slides.'
  llm: 'Imports a company template from a Google Slides presentation, as the app''s Templates drawer does: its theme, slide masters, layouts and slide size, not its slides. The presentation is read with the user''s Google account connected to Rollstack. Over REST, you can instead send a PowerPoint file as multipart/form-data in the file field: a .pptx of at most 100 MB, named after the file and kept to the user until shared with updateTemplate. Answers the template as listTemplates lists it, to pass as templateId to createReport or applyReportTemplate.'
parameters:
- name: name
  type: string
  required: true
  form: llm
  label:
    en_US: Name
  human_description:
    en_US: The template's name, as members will see it in Rollstack.
  llm_description: The template's name, as members will see it in Rollstack.
- name: googleSlidesId
  type: string
  required: true
  form: llm
  label:
    en_US: Google slides ID
  human_description:
    en_US: 'The Google Slides presentation to import the look of, by its link or its id: the part after /presentation/d/ in the link.'
  llm_description: 'The Google Slides presentation to import the look of, by its link or its id: the part after `/presentation/d/` in the link. It''s read with your Google account connected to Rollstack, so you must be able to open it.'
- name: sharedWithOrganization
  type: boolean
  required: false
  form: llm
  label:
    en_US: Shared with organization
  human_description:
    en_US: Whether everyone in the organization can use the template, or only you.
  llm_description: Whether everyone in the organization can use the template, or only you. Only admins can share a template with the organization; a template's creator can stop sharing it. Defaults to `false`.
output_schema:
  type: object
  properties:
    id:
      type: string
      description: The template, by its `id` from `listTemplates`.
    name:
      type: string
      description: The template's name, as members see it in Rollstack.
    builtIn:
      type: boolean
      description: '`true` for Rollstack''s own template, which every organization has; `false` for a company template.'
    source:
      type: string
      description: 'Where the template comes from, as Rollstack shows it: `Made by Rollstack`, `Shared by <member>` or `Only visible to you`.'
    sharedWithOrganization:
      type: boolean
      description: Whether everyone in the organization can use the company template.
    createdBy:
      type: object
      description: The member who imported the company template.
    createdAt:
      type: string
      description: When the company template was imported.
extra:
  python:
    source: tools/create_template.py

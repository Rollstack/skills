identity:
  name: listReportRuns
  author: rollstack
  label:
    en_US: List report runs
description:
  human:
    en_US: The runs of a report of any type that ended, newest first, with how each ended, what started it and why it failed, for questions such as why last night's update failed.
  llm: 'The runs of a report of any type that ended, newest first, with how each ended, what started it and why it failed, for questions such as why last night''s update failed. Answers up to limit runs, 20 by default and 200 at most, and a nextCursor: pass it as cursor for the next page, until it is null.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, of any type, by its id from listReports or createReport.
  llm_description: 'The report to act on, of any `type`, by its `id` from `listReports` or `createReport`. You can also copy it from the report''s link in Rollstack (`appUrl`): it''s the part right after `/slides/` or `/destinations/`.'
- name: limit
  type: number
  required: false
  form: llm
  label:
    en_US: Limit
  human_description:
    en_US: Maximum number of runs to return on this page, from 1 to 200.
  llm_description: Maximum number of runs to return on this page, from 1 to 200. Defaults to `20`.
  min: 1
  max: 200
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor
  human_description:
    en_US: 'Where to continue the list: pass the nextCursor returned with the previous page to get the next one.'
  llm_description: 'Where to continue the list: pass the `nextCursor` returned with the previous page to get the next one. Omit it for the first page.'
output_schema:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
      description: 'The report''s runs that ended, newest first, whoever started them: in the app, through the API or on a schedule.'
    nextCursor:
      type: string
      description: Pass it as `cursor` to get the next page of runs.
extra:
  python:
    source: tools/list_report_runs.py

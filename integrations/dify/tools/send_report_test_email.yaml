identity:
  name: sendReportTestEmail
  author: rollstack
  label:
    en_US: Send test email
description:
  human:
    en_US: Sends a report's email to the user only, and waits until it is sent.
  llm: Sends a report's email to the user only, and waits until it is sent. Only its editors may. Counts against the 5 sends a minute.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, of any type, by its id from listReports or createReport.
  llm_description: 'The report to act on, of any `type`, by its `id` from `listReports` or `createReport`. You can also copy it from the report''s link in Rollstack (`appUrl`): it''s the part right after `/slides/` or `/destinations/`.'
- name: idempotencyKey
  type: string
  required: false
  form: llm
  label:
    en_US: Idempotency key
  human_description:
    en_US: A unique value, such as a UUID, that makes retrying this call safe.
  llm_description: A unique value, such as a UUID, that makes retrying this call safe. A retry with the same key within 24 hours answers the first call's result instead of running it again. Use a new key for each new call. From 1 to 255 printable ASCII characters.
extra:
  python:
    source: tools/send_report_test_email.py

identity:
  name: renameBurst
  author: rollstack
  label:
    en_US: Rename burst
description:
  human:
    en_US: Renames a burst and answers it, and with renameVariants its reports too.
  llm: Renames a burst and answers it, and with renameVariants its reports too. Only the burst's owner and admins may.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Burst ID
  human_description:
    en_US: The burst to act on, by its id from listBursts.
  llm_description: 'The burst to act on, by its `id` from `listBursts`. You can also copy it from the burst''s link in Rollstack: it''s the part right after `/collections/`.'
- name: name
  type: string
  required: true
  form: llm
  label:
    en_US: Name
  human_description:
    en_US: The burst's new name.
  llm_description: The burst's new name.
- name: renameVariants
  type: boolean
  required: false
  form: llm
  label:
    en_US: Rename variants
  human_description:
    en_US: Whether to rename every report in the burst after the new name too, as variantNaming builds each name, the template included.
  llm_description: Whether to rename every report in the burst after the new name too, as `variantNaming` builds each name, the template included. A Rollstack report's burst renames the template, which is the report the burst was made from. Defaults to `false`.
- name: renameFiles
  type: boolean
  required: false
  form: llm
  label:
    en_US: Rename files
  human_description:
    en_US: 'For a burst of Google Slides, Google Docs, PowerPoint or Word reports: whether to also rename the burst''s folders, and with renameVariants each report''s file, in Google Drive or OneDrive.'
  llm_description: 'For a burst of Google Slides, Google Docs, PowerPoint or Word reports: whether to also rename the burst''s folders, and with `renameVariants` each report''s file, in Google Drive or OneDrive. It goes on after the answer. Defaults to `false`.'
output_schema:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the burst.
    name:
      type: string
      description: Name of the burst, as members see it in Rollstack.
    folderId:
      type: string
      description: The folder the burst is in, by its `id` in `listFolders`.
    owner:
      type: object
      description: 'The member who owns the burst: whoever created it, unless ownership has since been transferred in the app.'
    templateReportId:
      type: string
      description: The template report, which every variant was copied from when it was added, by its `id` for `getReport` and the other `/reports/{id}` endpoints.
    variantNaming:
      type: string
      description: 'How each variant''s report is named from the burst''s name and the name the variant is added with, `EMEA` in a burst named `Regional Review`: `suffix` gives `Regional Review - EMEA`, `prefix` gives `EMEA - Regional Review`, and `sameName` gives `EMEA`.'
    kind:
      type: string
      description: What the variants differ by.
    reportType:
      type: string
      description: 'The type of report the burst copies, as `type` in `listReports`: `SlideDeck` for a Rollstack report, which bursts by `parameters`, any other type for an older report, which bursts by `filters`.'
    parameters:
      type: array
      items:
        type: object
      description: The template report's parameters the variants differ by, in the order their values name a variant.
    filters:
      type: array
      items:
        type: object
      description: The filters of the template report's syncs that the variants differ by, primary ones first in the order their values name a variant.
    variantCount:
      type: number
      description: How many variants the burst has, including any you can't open.
    appUrl:
      type: string
      description: Link that opens the burst in Rollstack.
    createdAt:
      type: string
      description: When the burst was created.
    updatedAt:
      type: string
      description: When the burst's details last changed.
extra:
  python:
    source: tools/rename_burst.py

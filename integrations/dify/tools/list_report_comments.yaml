identity:
  name: listReportComments
  author: rollstack
  label:
    en_US: List comments
description:
  human:
    en_US: 'The comments on a report''s slides, oldest first: each thread''s first comment, whose threadId is null and which says whether the thread is resolved, then its replies.'
  llm: 'The comments on a report''s slides, oldest first: each thread''s first comment, whose threadId is null and which says whether the thread is resolved, then its replies. Read the open threads to see what reviewers asked for. Members who can view the report may.'
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Report ID
  human_description:
    en_US: The report to act on, by its id from listReports or createReport.
  llm_description: 'The report to act on, by its `id` from `listReports` or `createReport`. Only reports whose `type` is `SlideDeck` work here: another type, such as a Google Slides presentation, returns `400`. You can also copy it from the report''s link in Rollstack: it''s the part right after `/slides/`.'
output_schema:
  type: object
  properties:
    comments:
      type: array
      items:
        type: object
      description: 'The comments on a report''s slides, oldest first: each thread''s first comment, whose threadId is null and which says whether the thread is resolved, then its replies.'
extra:
  python:
    source: tools/list_report_comments.py
